<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | ExamEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-wrapper">

<div class="auth-card">
    <div class="auth-header">
        <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">Exam<span>Ease</span>.</a>
        <h1>Create Student Account</h1>
        <p>Register to start taking online examinations</p>
    </div>

    <!-- Error message display -->
    <div class="alert alert-danger" th:if="${error != null}">
        <span>⚠️</span>
        <span th:text="${error}">An error occurred</span>
    </div>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" th:value="${name}" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="e.g. student@university.edu" th:value="${email}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password (min 6 characters)" minlength="6" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter your password" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">Register Account</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted);">
        Already have an account? <a href="/login" style="font-weight: 600;">Sign in here</a>
    </div>

    <div style="text-align: center; margin-top: 16px;">
        <a href="/" style="font-size: 13px; color: var(--muted-light);">← Back to Homepage</a>
    </div>
</div>

</body>
</html>
