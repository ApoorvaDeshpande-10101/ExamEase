<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | ExamEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar">
    <a href="/" class="brand-logo">Exam<span>Ease</span>.</a>
</nav>

<div class="auth-container" style="max-width: 500px; margin: 80px auto;">
    <div class="card p-4 text-center">
        <div style="font-size: 48px; color: #ef4444; margin-bottom: 15px;">⚠️</div>
        <h2 style="color: #1e293b; margin-bottom: 10px;" th:text="${errorTitle != null ? errorTitle : 'Oops! Something went wrong'}">Error</h2>
        <p style="color: #64748b; margin-bottom: 25px; line-height: 1.6;" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or processed.'}">
            An error occurred while processing your request.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
            <a href="/" class="btn btn-primary">Return to Home</a>
        </div>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2026 ExamEase. All rights reserved.</p>
</footer>

</body>
</html>
